name: Exercice Setup Node 18

on:
  workflow_dispatch:

jobs:
  job_node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installer Node.js version 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Afficher la version de Node
        run: node -v
