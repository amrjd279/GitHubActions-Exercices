name: Exercice Matrices

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-${{ matrix.version_ubuntu }}.04
    strategy:
      matrix:
        version_ubuntu: [22, 24]
        version_node: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version_node }}

      - name: Afficher les versions utilisées
        run: |
          echo "Version Ubuntu : ${{ matrix.version_ubuntu }}.04"
          echo "Version Node : ${{ matrix.version_node }}"
          node -v
